<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Bebas+Neue&display=swap');

  :root {
    --navy: #10101f;
    --navy2: #1b2036;
    --table: #2e6cb8;
    --red: #e53935;
    --red-soft: #ff6b66;
    --ink: #f2f3f8;
    --muted: #8f97b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 675px;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    background:
      radial-gradient(1000px 600px at 85% -10%, rgba(46,108,184,0.25), transparent 60%),
      radial-gradient(700px 500px at -5% 110%, rgba(229,57,53,0.16), transparent 60%),
      linear-gradient(150deg, var(--navy) 0%, var(--navy2) 100%);
    color: var(--ink);
    position: relative;
    overflow: hidden;
  }

  /* 卓球台のエッジ: 左端の青帯 + 白ライン */
  .table-edge {
    position: absolute; left: 0; top: 0; bottom: 0; width: 14px;
    background: var(--table);
  }
  .table-line {
    position: absolute; left: 22px; top: 0; bottom: 0; width: 3px;
    background: rgba(255,255,255,0.85);
  }

  /* うっすらドットパターン（ボールの連想） */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.05) 1.5px, transparent 1.5px);
    background-size: 34px 34px;
  }

  .content { position: relative; z-index: 2; padding: 58px 72px 0 88px; height: 100%; display: flex; flex-direction: column; }

  .kicker {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 18px;
  }
  .kicker .en {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px; letter-spacing: 6px; color: var(--table);
  }
  .kicker .ja {
    font-size: 17px; font-weight: 700; color: var(--muted); letter-spacing: 3px;
    border-left: 2px solid rgba(143,151,184,0.4); padding-left: 14px;
  }

  h1 {
    font-weight: 900; font-size: 56px; line-height: 1.3; letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  h1 .accent {
    color: var(--red-soft);
    text-shadow: 0 0 40px rgba(229,57,53,0.35);
  }

  /* ラリー軌道 + 3ポイント */
  .rally { position: relative; flex: 1; margin-top: 10px; }
  .rally svg.path { position: absolute; inset: 0; width: 100%; height: 100%; }

  .points { position: absolute; left: 0; right: 0; bottom: 78px; display: flex; gap: 28px; }
  .point { flex: 1; position: relative; padding-top: 58px; }

  /* 卓球ボール型の番号バッジ */
  .ball {
    position: absolute; top: 0; left: 0;
    width: 46px; height: 46px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ffffff 0%, #f4f2ec 55%, #d9d5c8 100%);
    box-shadow: 0 6px 18px rgba(0,0,0,0.45), inset -3px -5px 8px rgba(0,0,0,0.08);
    display: flex; align-items: center; justify-content: center;
  }
  .ball::after {
    /* ボールのシームライン */
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at -30% 120%, transparent 62%, rgba(180,175,160,0.55) 62.5%, transparent 66%);
  }
  .ball .n {
    font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--red);
    transform: translateY(1px);
  }

  .point h2 { font-size: 23px; font-weight: 900; line-height: 1.4; margin-bottom: 8px; min-height: 66px; }
  .point h2 .em { border-bottom: 3px solid var(--red); padding-bottom: 1px; }
  .point p { font-size: 15.5px; font-weight: 500; color: var(--muted); line-height: 1.75; }

  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 72px 28px 88px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 40px; height: 40px; background: #08080f; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .logo-inner {
    width: 25px; height: 25px; background: var(--red); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 13px; font-weight: 900;
  }
  .brand .name { font-size: 18px; font-weight: 900; }
  .brand .desc { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .free {
    font-family: 'Bebas Neue', sans-serif; font-size: 19px; letter-spacing: 3px;
    color: var(--red-soft); border: 1.5px solid rgba(229,57,53,0.55);
    padding: 6px 18px; border-radius: 999px;
  }

  /* 右上の大きなボール（装飾） */
  .hero-ball {
    position: absolute; top: 46px; right: 64px; width: 108px; height: 108px; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #ffffff 0%, #f2efe7 50%, #cfcaba 100%);
    box-shadow: 0 24px 50px rgba(0,0,0,0.5), inset -6px -10px 18px rgba(0,0,0,0.1);
    z-index: 1;
  }
  .hero-ball::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at -40% 130%, transparent 60%, rgba(170,165,148,0.6) 60.6%, transparent 63.5%);
  }
</style>
</head>
<body>
  <div class="table-edge"></div>
  <div class="table-line"></div>
  <div class="dots"></div>
  <div class="hero-ball"></div>

  <div class="content">
    <div class="kicker">
      <span class="en">RALLY NOTE 02</span>
      <span class="ja">卓球・記録のコツ</span>
    </div>
    <h1>負けた試合ほど、<br><span class="accent">記録する価値</span>がある。</h1>

    <div class="rally">
      <!-- バウンドする球の軌道（点線） -->
      <svg class="path" viewBox="0 0 1040 300" preserveAspectRatio="none" fill="none">
        <path d="M -30 40 Q 80 150 173 208 Q 320 60 528 205 Q 700 68 883 204 Q 980 140 1070 120"
          stroke="rgba(255,255,255,0.28)" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round"/>
        <!-- バウンドの影 -->
        <ellipse cx="173" cy="232" rx="26" ry="5" fill="rgba(0,0,0,0.35)"/>
        <ellipse cx="528" cy="232" rx="26" ry="5" fill="rgba(0,0,0,0.35)"/>
        <ellipse cx="883" cy="232" rx="26" ry="5" fill="rgba(0,0,0,0.35)"/>
      </svg>

      <div class="points">
        <div class="point">
          <div class="ball" style="left: calc(50% - 23px);"><span class="n">1</span></div>
          <h2 style="text-align:center;">タグが<span class="em">課題</span>を<br>教えてくれる</h2>
          <p style="text-align:center;">負け試合に付けたタグが溜まるほど<br>自分の弱点が浮かび上がる</p>
        </div>
        <div class="point">
          <div class="ball" style="left: calc(50% - 23px);"><span class="n">2</span></div>
          <h2 style="text-align:center;">「なんとなく苦手」が<br><span class="em">言葉に変わる</span></h2>
          <p style="text-align:center;">感覚ではなく<br>「レシーブで負けてる」とわかる</p>
        </div>
        <div class="point">
          <div class="ball" style="left: calc(50% - 23px);"><span class="n">3</span></div>
          <h2 style="text-align:center;">数字で見えると<br><span class="em">練習が変わる</span></h2>
          <p style="text-align:center;">課題がはっきりすれば<br>次にやるべき練習も決まる</p>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="brand">
      <div class="logo"><div class="logo-inner">卓</div></div>
      <span class="name">卓球記録ノート</span>
      <span class="desc">── 試合を記録して、強くなる</span>
    </div>
    <div class="free">FREE / 全機能無料</div>
  </div>
</body>
</html>
